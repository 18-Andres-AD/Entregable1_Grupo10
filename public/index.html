<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios y Mascotas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="encabezado">
    <div class="contenedor">
      <h1>Usuarios y Mascotas</h1>
      <p>Registro de usuarios y mascotas con imágenes. Entregable 1, Grupo 10.</p>
    </div>
  </header>

  <main class="contenedor columnas">
    <section class="panel">
      <div class="panel-titulo">
        <h2>Nuevo usuario</h2>
        <span class="etiqueta">/api/users</span>
      </div>

      <form id="form-usuario" action="/api/users" novalidate>
        <div class="fila">
          <div class="campo">
            <label for="firstname">Nombre</label>
            <input id="firstname" name="firstname" placeholder="Ej: Andrés" required>
          </div>
          <div class="campo">
            <label for="lastname">Apellido</label>
            <input id="lastname" name="lastname" placeholder="Ej: Díaz" required>
          </div>
        </div>

        <div class="campo">
          <label for="username">Usuario</label>
          <input id="username" name="username" autocomplete="username" placeholder="correo o nombre de usuario" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <div class="con-boton">
            <input id="password" name="password" type="password" autocomplete="new-password" required>
            <button type="button" id="ver-password" class="boton-texto">Mostrar</button>
          </div>
          <small>La contraseña se guarda encriptada.</small>
        </div>

        <div class="campo">
          <span class="label">Foto de perfil</span>
          <label class="subir-archivo" for="avatar">
            <input id="avatar" name="avatar" type="file" accept="image/*">
            <span class="subir-texto">Elegir imagen</span>
          </label>
        </div>

        <button type="submit" class="boton">Crear usuario</button>
        <p class="mensaje"></p>
      </form>

      <h3>Usuarios registrados</h3>
      <ul class="lista" id="lista-usuarios"></ul>
    </section>

    <section class="panel">
      <div class="panel-titulo">
        <h2>Nueva mascota</h2>
        <span class="etiqueta">/api/pets</span>
      </div>

      <form id="form-mascota" action="/api/pets" novalidate>
        <div class="fila">
          <div class="campo">
            <label for="especie">Especie</label>
            <input id="especie" name="especie" placeholder="Ej: Perro" required>
          </div>
          <div class="campo">
            <label for="color">Color</label>
            <input id="color" name="color" placeholder="Ej: Café" required>
          </div>
        </div>

        <div class="fila">
          <div class="campo">
            <label for="edad">Edad (años)</label>
            <input id="edad" name="edad" type="number" min="0" required>
          </div>
          <div class="campo">
            <label for="sexo">Sexo</label>
            <select id="sexo" name="sexo" required>
              <option value="macho">Macho</option>
              <option value="hembra">Hembra</option>
            </select>
          </div>
        </div>

        <div class="campo">
          <span class="label">Fotos (máximo 5)</span>
          <label class="subir-archivo" for="img">
            <input id="img" name="img" type="file" accept="image/*" multiple>
            <span class="subir-texto">Elegir imágenes</span>
          </label>
        </div>

        <button type="submit" class="boton">Crear mascota</button>
        <p class="mensaje"></p>
      </form>

      <h3>Mascotas registradas</h3>
      <ul class="lista" id="lista-mascotas"></ul>
    </section>
  </main>
</body>
</html>
